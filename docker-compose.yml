name: shopping-app

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

x-shop-api-build: &shop-api-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    SERVICE: shop-api

x-shop-database-url: &shop-database-url postgresql://shop:${SHOP_DB_PASSWORD:-shop}@postgres:5432/shop

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      shop-api:
        condition: service_healthy
      webapp:
        condition: service_healthy
    networks:
      - edge

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
    networks:
      - edge

  shop-api:
    image: shopping-app/shop-api
    build: *shop-api-build
    environment:
      DATABASE_URL: *shop-database-url
    depends_on:
      shop-api-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health/ready"]
    networks:
      - edge
      - backend

  shop-api-migrate:
    image: shopping-app/shop-api
    build: *shop-api-build
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: *shop-database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  payments-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE: payments-api
    environment:
      PAYMENTS_API_KEY: ${PAYMENTS_API_KEY:-local-only-payments-api-key-change-me}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health"]
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-shop}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
