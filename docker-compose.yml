name: shopping-app

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 5s

x-shop-api-build: &shop-api-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    SERVICE: shop-api

x-shop-database-url: &shop-database-url postgresql://shop:${SHOP_DB_PASSWORD:-shop}@postgres:5432/shop

x-payments-api-build: &payments-api-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    SERVICE: payments-api

x-payments-database-url: &payments-database-url postgresql://payments:${PAYMENTS_DB_PASSWORD:-payments}@postgres:5432/payments

x-payment-webhook-secret: &payment-webhook-secret ${PAYMENT_WEBHOOK_SECRET:-local-only-payment-webhook-secret-change-me}

x-payments-api-key: &payments-api-key ${PAYMENTS_API_KEY:-local-only-payments-api-key-change-me}

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      shop-api:
        condition: service_healthy
      webapp:
        condition: service_healthy
    networks:
      - edge

  webapp:
    build:
      context: .
      dockerfile: webapp/Dockerfile
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
    networks:
      - edge

  shop-api:
    image: shopping-app/shop-api
    build: *shop-api-build
    environment:
      DATABASE_URL: *shop-database-url
      PAYMENTS_API_URL: http://payments-api:3000
      PAYMENTS_API_KEY: *payments-api-key
      ORDER_ACCESS_SECRET: ${ORDER_ACCESS_SECRET:-local-only-order-access-secret-change-me}
      ORDER_COOKIE_SECURE: "false"
    depends_on:
      shop-api-migrate:
        condition: service_completed_successfully
      payments-api:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health/ready"]
    networks:
      - edge
      - backend

  shop-api-migrate:
    image: shopping-app/shop-api
    build: *shop-api-build
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: *shop-database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  payments-api:
    image: shopping-app/payments-api
    build: *payments-api-build
    environment:
      DATABASE_URL: *payments-database-url
      PAYMENTS_API_KEY: *payments-api-key
      PAYMENT_WEBHOOK_URL: http://shop-api:3000/webhooks/payments
      PAYMENT_WEBHOOK_SECRET: *payment-webhook-secret
    depends_on:
      payments-api-migrate:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/health/ready"]
    networks:
      - backend

  payments-api-migrate:
    image: shopping-app/payments-api
    build: *payments-api-build
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: *payments-database-url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SHOP_DB_PASSWORD: ${SHOP_DB_PASSWORD:-shop}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  postgres-data:
